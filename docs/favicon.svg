<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 128 128">
    <defs>
        <!-- Gradient matching the Orange-Amber-Cyan branding -->
        <linearGradient id="favicon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f97316" />
            <stop offset="60%" stop-color="#ffb703" />
            <stop offset="100%" stop-color="#00f5ff" />
        </linearGradient>
        
        <!-- Subtle shadow/glow for depth -->
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="4" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
        </filter>
    </defs>
    
    <!-- Outer Finder square (thick border, rounded corners) -->
    <rect x="18" y="18" width="92" height="92" rx="26" stroke="url(#favicon-grad)" stroke-width="12" filter="url(#glow)" />
    
    <!-- Inner Finder solid dot -->
    <rect x="46" y="46" width="36" height="36" rx="10" fill="url(#favicon-grad)" />
    
    <!-- Tech dot accent in the bottom-right corner -->
    <circle cx="94" cy="94" r="8" fill="#00f5ff" />
</svg>
